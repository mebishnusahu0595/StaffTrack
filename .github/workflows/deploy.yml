name: 🚀 Deploy StaffTrack to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Server (66.116.249.160)
    runs-on: self-hosted

    steps:
      - name: 📋 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: /var/www/stafftrack

      - name: ⬇️ Pull Latest Code
        run: git pull origin main
        working-directory: /var/www/stafftrack

      - name: 🔨 Build Backend
        working-directory: /var/www/stafftrack/backend
        run: |
          npx prisma generate
          npx prisma db push
          npm run build

      - name: 🏗️ Build Admin Frontend
        working-directory: /var/www/stafftrack/apps/admin
        run: npm run build

      - name: ♻️ Restart PM2 Services
        run: |
          pm2 restart stafftrack-backend stafftrack-frontend
          pm2 save

      - name: ✅ Deployment Complete
        run: echo "Deployment to stafftrack.cloud completed successfully!"
